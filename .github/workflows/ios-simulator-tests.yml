# FREE iOS Appium tests for Wikipedia iOS: GitHub Actions macOS runner + iOS Simulator. No Apple account, no BrowserStack.
# Install: copy to  .github/workflows/ios-simulator-tests.yml  in a PUBLIC fork of wikimedia/wikipedia-ios
# (standard GitHub-hosted runners are free for public repos: docs.github.com/en/actions/concepts/billing-and-usage).
# Run: GitHub web UI -> Actions -> "iOS simulator Appium tests" -> Run workflow.
# Tests live in the fork under  ui-tests/python  (pytest)  or  ui-tests/java  (Maven)  -- see README.
# I could not execute this on a macOS runner; items marked UNVERIFIED may need a tweak on the first run.
name: iOS simulator Appium tests

on:
  workflow_dispatch:
    inputs:
      test_language:
        description: "What to run: smoke (built-in launch+screenshot+page-source check, no test code needed), typescript (npm script, e.g. WebdriverIO), python (pytest), java (Maven)"
        type: choice
        options: [smoke, typescript, python, java]
        default: smoke
      test_dir:
        description: "python/java only: folder that holds the tests (contains python/ and java/)"
        type: string
        default: ui-tests
      tests_dir:
        description: "typescript only: folder with package.json (relative to the repo root, or to tests_repo/tests_gitlab if set; '.' = its root)"
        type: string
        default: ui-tests/typescript
      test_command:
        description: "typescript only: npm command to run the tests"
        type: string
        default: "npm run test:ios"
      tests_repo:
        description: "OPTIONAL: separate repo with the tests, owner/name (e.g. their existing Android repo). Empty = tests are in this fork"
        type: string
        default: ""
      tests_ref:
        description: "OPTIONAL: branch/tag of tests_repo or tests_gitlab (empty = its default branch)"
        type: string
        default: ""
      tests_gitlab:
        description: "OPTIONAL: GitLab repo with the tests, host/path without https:// (e.g. gitlab.com/mygroup/wikipedia-appium). Private: add secret GITLAB_TOKEN"
        type: string
        default: ""
      device_name:
        description: "Simulator model (must exist on the runner image; macos-26 image lists iPhone 17, iPhone 17 Pro, iPhone Air, ...)"
        type: string
        default: "iPhone 17"
      ios_version:
        description: "Simulator iOS version (macos-26 image has 26.2, 26.4, 26.5)"
        type: string
        default: "26.5"
      xcode_version:
        description: "Xcode on the runner (macos-26 image has 26.0.1 ... 26.6; 26.6 is default). Repo README needs >= 16.0; its SwiftPM packages need Swift tools 6.2 => Xcode 26+"
        type: string
        default: "26.6"
      runner:
        description: "Hosted runner label (macos-26-intel when arm64 macos-26 has no capacity)"
        type: string
        default: "macos-26-intel"
      appium_version:
        description: "npm version/tag of appium. 'latest' (v4 at time of writing) works with the newest xcuitest driver; use '2' only together with xcuitest_version '9' (older, may lack iOS 26 fixes - UNVERIFIED)"
        type: string
        default: "latest"
      xcuitest_version:
        description: "xcuitest driver version (empty = newest compatible with the Appium you chose; e.g. '9' for Appium 2)"
        type: string
        default: ""
      prebuild_wda:
        description: "Build WebDriverAgent once up front and reuse it (strongly recommended: building WDA inside session creation timed out on Intel runners)"
        type: boolean
        default: true
      app_ref:
        description: "Wikipedia app version to build (tag/branch). releases/2026.10.13 = last one that builds with Xcode 26"
        type: string
        default: "releases/2026.10.13"

env:
  SCHEME: Wikipedia
  CONFIGURATION: Debug
  ART: ${{ github.workspace }}/artifacts
  DD: ${{ github.workspace }}/build-dd
  WDA_DD: ${{ github.workspace }}/wda-dd
  APPIUM_URL: http://127.0.0.1:4723

jobs:
  ios-tests:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          repository: wikimedia/wikipedia-ios
          ref: ${{ inputs.app_ref }}

      # Only when the tests live in another repo. Private repo: add secret TESTS_REPO_TOKEN (fine-grained PAT, Contents: read-only on that repo).
      - name: Check out the separate tests repo
        if: inputs.tests_repo != ''
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.tests_repo }}
          ref: ${{ inputs.tests_ref }}
          token: ${{ secrets.TESTS_REPO_TOKEN || github.token }}
          path: tests-repo

      # Tests in GitLab. Private repo: create a GitLab Project Access Token (role Reporter, scope read_repository)
      # and save it in this GitHub repo as secret GITLAB_TOKEN. Public GitLab repo: no secret needed.
      - name: Clone the tests repo from GitLab
        if: inputs.tests_gitlab != '' && inputs.tests_repo == ''
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GL_REPO: ${{ inputs.tests_gitlab }}
          GL_REF: ${{ inputs.tests_ref }}
        run: |
          GL_REPO="${GL_REPO#https://}"; GL_REPO="${GL_REPO%.git}"
          if [ -n "$GITLAB_TOKEN" ]; then URL="https://oauth2:${GITLAB_TOKEN}@${GL_REPO}.git"; else URL="https://${GL_REPO}.git"; fi
          git clone --depth 1 ${GL_REF:+--branch "$GL_REF"} "$URL" tests-repo
          git -C tests-repo log -1 --oneline

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          WANT="/Applications/Xcode_${{ inputs.xcode_version }}.app"
          if [ -n "${{ inputs.xcode_version }}" ] && [ -d "$WANT" ]; then XC="$WANT"
          else XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1); fi
          echo "Using $XC"
          sudo xcode-select -switch "$XC"
          xcodebuild -version
          mkdir -p "$ART"/{appium,screenshots,reports,logs}

      # scripts/setup (full) installs linters and may prompt. For a simulator build only this is needed:
      # it writes the git-ignored Configurations/OpenSourceDebug.xcconfig the Xcode project references.
      # 'ci' skips the prompt (see scripts/setup_bundle_id). SwiftLint is optional (build phase only warns if missing).
      - name: Repo setup (non-interactive)
        run: scripts/setup_bundle_id ci

      - name: Find simulator
        run: |
          xcrun simctl list runtimes
          OUT=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          name="${{ inputs.device_name }}"; ver="${{ inputs.ios_version }}"
          c=[]
          for rt,devs in json.load(sys.stdin)["devices"].items():
              if "iOS" not in rt: continue
              v=rt.split("iOS-")[-1].replace("-",".")
              k=tuple(int(x) for x in v.split("."))
              for x in devs:
                  if x["name"].startswith("iPhone"):
                      c.append((x["name"]==name and v==ver, k, x["udid"], x["name"], v))
          c.sort(reverse=True); _,_,u,n,v=c[0]; print(u, v, n)')
          read UDID PV DN <<< "$OUT"
          echo "Picked: $DN / iOS $PV / $UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          echo "SIM_IOS=$PV" >> "$GITHUB_ENV"
          echo "SIM_NAME=$DN" >> "$GITHUB_ENV"

      # Ad-hoc signing ("-", no Apple account needed). With CODE_SIGNING_ALLOWED=NO the app has NO entitlements,
      # so the app-group container lookup fails (NOT_CODESIGNED) and Wikipedia crashes with SIGSEGV ~1 s after launch.
      - name: Build Wikipedia for the iOS Simulator (ad-hoc signed)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Wikipedia.xcodeproj -scheme "$SCHEME" -configuration "$CONFIGURATION" \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath "$DD" \
            -onlyUsePackageVersionsFromResolvedFile -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee "$ART/logs/xcodebuild-app.log" | grep -E "error:|BUILD (SUCCEEDED|FAILED)"
          APP="$DD/Build/Products/${CONFIGURATION}-iphonesimulator/Wikipedia.app"
          test -d "$APP" || { echo "::error::Wikipedia.app not found at $APP"; find "$DD/Build/Products" -maxdepth 2; exit 1; }
          echo "Entitlements baked into the app (must list group.org.wikimedia.wikipedia):"
          codesign -d --entitlements - "$APP" 2>&1 | grep -iE "application-groups|group\.org\.wikimedia" \
            || echo "::warning::No app-group entitlement found - the app will probably crash on launch"
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Install Appium + XCUITest driver
        run: |
          npm install -g "appium@${{ inputs.appium_version }}"
          V="${{ inputs.xcuitest_version }}"
          appium driver install "xcuitest${V:+@$V}"
          appium -v
          appium driver list --installed

      # Optional speed-up (verified option names: usePrebuiltWDA + derivedDataPath, appium-xcuitest-driver capabilities doc).
      # If this fails, sessions fall back to building WDA themselves (slow); the log is in artifacts/logs/xcodebuild-wda.log.
      - name: Prebuild WebDriverAgent
        if: inputs.prebuild_wda
        timeout-minutes: 30
        continue-on-error: true
        run: |
          set -o pipefail
          WDA_PROJ=$(find "$HOME/.appium" -name WebDriverAgent.xcodeproj -not -path "*/Pods/*" | head -1)
          echo "WDA project: $WDA_PROJ"
          test -n "$WDA_PROJ" || { echo "::error::WebDriverAgent.xcodeproj not found under ~/.appium"; exit 1; }
          START=$(date +%s)
          xcodebuild build-for-testing \
            -project "$WDA_PROJ" -scheme WebDriverAgentRunner \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath "$WDA_DD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee "$ART/logs/xcodebuild-wda.log" | grep -E "error:|\*\* (TEST BUILD|BUILD) (SUCCEEDED|FAILED)"
          echo "WDA build took $(( $(date +%s) - START ))s"
          XCTESTRUN=$(find "$WDA_DD/Build/Products" -name "*.xctestrun" | head -1)
          test -n "$XCTESTRUN" || { echo "::error::WDA built but no .xctestrun found"; find "$WDA_DD/Build/Products" -maxdepth 2; exit 1; }
          echo "xctestrun: $XCTESTRUN"
          # Only switch to the prebuilt WDA once it really exists.
          echo "USE_PREBUILT_WDA=1" >> "$GITHUB_ENV"
          echo "WDA_DERIVED_DATA=$WDA_DD" >> "$GITHUB_ENV"

      # Boot WITH the Simulator UI open. Last run, Appium found a headless-booted simulator
      # and rebooted it with the window visible, which cost ~96 s inside session creation.
      - name: Boot simulator (UI visible)
        run: |
          xcrun simctl boot "$UDID" || true
          open -a Simulator --args -CurrentDeviceUDID "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl list devices | grep "$UDID"

      - name: Start Appium server (background)
        run: |
          nohup appium --address 127.0.0.1 --port 4723 --log-no-colors \
            --log "$ART/appium/appium-server.log" > "$ART/appium/appium-stdout.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf "$APPIUM_URL/status" && break; sleep 2; done
          curl -s "$APPIUM_URL/status"

      - name: Export values the tests read
        run: |
          {
            echo "DEVICE_NAME=$SIM_NAME"
            echo "PLATFORM_VERSION=$SIM_IOS"
            echo "ARTIFACT_DIR=$ART"
            echo "APPIUM_HOST=127.0.0.1"
            echo "APPIUM_PORT=4723"
            echo "PLATFORM_NAME=iOS"
          } >> "$GITHUB_ENV"

      # ---------- built-in smoke test: stdlib-only Python talking W3C WebDriver to Appium ----------
      - name: Smoke test (launch app, screenshot, dump page source)
        if: inputs.test_language == 'smoke'
        timeout-minutes: 40
        run: |
          python3 - <<'PY'
          import base64, json, os, subprocess, time, urllib.request, urllib.error
          base = os.environ["APPIUM_URL"]; art = os.environ["ARTIFACT_DIR"]
          def call(method, path, body=None, timeout=600):
              req = urllib.request.Request(base + path, method=method,
                  data=json.dumps(body).encode() if body is not None else None,
                  headers={"Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return json.load(r)["value"]
              except urllib.error.HTTPError as e:
                  print("APPIUM ERROR:", e.read().decode(errors="replace")[:4000])
                  raise
          caps = {
            "platformName": "iOS",
            "appium:automationName": "XCUITest",
            "appium:deviceName": os.environ["DEVICE_NAME"],
            "appium:platformVersion": os.environ["PLATFORM_VERSION"],
            "appium:udid": os.environ["UDID"],
            "appium:app": os.environ["APP_PATH"],
            "appium:wdaLaunchTimeout": 240000,
            "appium:wdaConnectionTimeout": 240000,
            "appium:wdaStartupRetries": 2,
            # Last run the session expired (300 s idle) while the script was still polling simctl.
            "appium:newCommandTimeout": 1800,
            "appium:autoAcceptAlerts": True,
            # Print WDA's xcodebuild output into the Appium log, so a WDA failure shows its real error.
            "appium:showXcodeLog": True,
            # Slow (Intel) runners: don't let WDA launch the app inside session creation
            # (that has a short internal timeout). We launch it ourselves below.
            "appium:autoLaunch": False,
          }
          if os.environ.get("USE_PREBUILT_WDA"):
              caps["appium:usePrebuiltWDA"] = True
              caps["appium:derivedDataPath"] = os.environ["WDA_DERIVED_DATA"]
          print("Using prebuilt WDA:", bool(os.environ.get("USE_PREBUILT_WDA")))
          # Session creation (sim setup + app install + WDA start, 2 retries x 240 s) can exceed 10 min,
          # so the client must wait longer than Appium does, or it gives up first.
          s = call("POST", "/session", {"capabilities": {"alwaysMatch": caps}}, timeout=1500)
          sid = s["sessionId"]
          print("Session created:", sid)
          try:
              udid = os.environ["UDID"]; bid = "org.wikimedia.wikipedia"
              r = subprocess.run(["xcrun", "simctl", "launch", udid, bid], capture_output=True, text=True)
              print("simctl launch:", r.returncode, r.stdout.strip(), r.stderr.strip())
              t0 = time.time(); seen = 0; running = False
              while time.time() - t0 < 120:            # 2 min max; app must stay up for 3 checks in a row
                  time.sleep(10)
                  ps = subprocess.run(["xcrun", "simctl", "spawn", udid, "launchctl", "list"],
                                      capture_output=True, text=True).stdout
                  running = bid in ps
                  seen = seen + 1 if running else 0
                  print(f"[{int(time.time()-t0)}s] app running: {running}")
                  call("GET", f"/session/{sid}/timeouts")   # keep the Appium session alive while waiting
                  if seen >= 3:
                      break
              os.makedirs(art + "/smoke", exist_ok=True)
              open(art + "/smoke/page_source.xml", "w").write(call("GET", f"/session/{sid}/source"))
              open(art + "/screenshots/smoke.png", "wb").write(base64.b64decode(call("GET", f"/session/{sid}/screenshot")))
              print("Page source + screenshot saved")
          finally:
              try:
                  call("DELETE", f"/session/{sid}")
              except Exception as e:
                  print("DELETE session failed (ignored):", e)
          if not running:
              print("::error::Wikipedia is not running after launch - it crashed. See artifacts/crash and logs/wikipedia-app.log.")
              raise SystemExit(1)
          print("OK: Wikipedia launched and stayed up")
          PY

      # ---------- consultant's TypeScript tests (WebdriverIO / any npm script) ----------
      - name: Set up Node for the tests
        if: inputs.test_language == 'typescript'
        uses: actions/setup-node@v4
        with:
          node-version: "24"   # the Appium server is already running on the runner's own Node; this only affects the test step

      - name: Run TypeScript tests (npm ci + test command)
        if: inputs.test_language == 'typescript'
        run: |
          ROOT="${{ (inputs.tests_repo != '' || inputs.tests_gitlab != '') && 'tests-repo' || '.' }}"
          cd "$ROOT/${{ inputs.tests_dir }}"
          pwd; ls
          npm ci
          ${{ inputs.test_command }}

      # ---------- consultant's Python tests ----------
      - name: Run Python tests (pytest)
        if: inputs.test_language == 'python'
        working-directory: ${{ inputs.test_dir }}/python
        run: |
          python3 -m venv .venv && . .venv/bin/activate
          pip install -r requirements.txt
          pytest -v --junitxml="$ART/reports/pytest-junit.xml"

      # ---------- consultant's Java tests ----------
      - name: Run Java tests (Maven)
        if: inputs.test_language == 'java'
        working-directory: ${{ inputs.test_dir }}/java
        run: |
          which mvn || brew install maven
          mvn -B test
          mkdir -p "$ART/reports/surefire" && cp -R target/surefire-reports/. "$ART/reports/surefire/" || true

      # ---------- always: evidence for debugging ----------
      - name: Show Appium log on failure
        if: failure()
        timeout-minutes: 2
        continue-on-error: true
        run: |
          echo "===== appium-server.log (last 200 lines, retries removed) ====="
          grep -v ECONNREFUSED "$ART/appium/appium-server.log" | tail -n 200 || true
          echo "===== WDA-related lines ====="
          grep -iE "xcodebuild|WebDriverAgent|xctest|Testing failed|error:" "$ART/appium/appium-server.log" | grep -v ECONNREFUSED | tail -n 80 || true
          if [ -f "$ART/logs/xcodebuild-wda.log" ]; then
            echo "===== xcodebuild-wda.log (errors + last 40 lines) ====="
            grep -E "error:" "$ART/logs/xcodebuild-wda.log" | head -n 40 || true
            tail -n 40 "$ART/logs/xcodebuild-wda.log"
          fi

      - name: Collect crash reports + app log
        if: always()
        timeout-minutes: 4
        continue-on-error: true
        run: |
          mkdir -p "$ART/crash"
          find ~/Library/Logs/DiagnosticReports -iname "*Wikipedia*" -exec cp {} "$ART/crash/" \; 2>/dev/null || true
          ls -la "$ART/crash"
          for f in "$ART"/crash/*; do if [ -f "$f" ]; then echo "===== $f"; head -n 80 "$f"; fi; done
          perl -e 'alarm 150; exec @ARGV' xcrun simctl spawn "$UDID" log show --last 15m --style compact \
            --predicate 'process == "Wikipedia" OR eventMessage CONTAINS "org.wikimedia.wikipedia"' \
            > "$ART/logs/wikipedia-app.log" 2>&1 || true
          echo "===== wikipedia-app.log: errors/faults ====="
          grep -iE "fault|error|crash|terminat|exception" "$ART/logs/wikipedia-app.log" | tail -n 60 || true
          echo "===== app exits (signal / reason) ====="
          grep -E "Process exited|pending exit for reason|NOT_CODESIGNED" "$ART/logs/wikipedia-app.log" | tail -n 20 || true

      # Upload BEFORE the slow simulator-log step, so a hang there can't lose the logs.
      - name: Upload artifacts (logs so far)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: artifacts
          retention-days: 7
          if-no-files-found: warn

      - name: Final screenshot + simulator log
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        run: |
          # perl alarm = hard time limit per command (macOS has no `timeout`)
          perl -e 'alarm 60; exec @ARGV' xcrun simctl io "$UDID" screenshot "$ART/screenshots/final-simulator.png" || true
          perl -e 'alarm 120; exec @ARGV' xcrun simctl spawn "$UDID" log show --last 5m --style compact > "$ART/logs/simulator-syslog.txt" 2>&1 || true

      - name: Upload final screenshot + simulator log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ios-final-state
          path: |
            artifacts/screenshots/final-simulator.png
            artifacts/logs/simulator-syslog.txt
          retention-days: 7
          if-no-files-found: ignore
